name: AltBullet snapshot retry validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  altbullet-snapshot-retry:
    name: AltBullet snapshot retry PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: altbullet_snapshot_ci
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d altbullet_snapshot_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run AltBullet snapshot retry integration test
        env:
          TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/altbullet_snapshot_ci
        run: pnpm --filter @workspace/api-server run test:altbullet-snapshot:integration
