    LcWaitingShadowReport:
      type: object
      additionalProperties: false
      required: [shadowOnly, settings, summary, obAnalysis, rows]
      properties:
        shadowOnly: { type: boolean, const: true }
        settings:
          type: object
          additionalProperties: false
          required: [ttlHours, postTouchHours, nearMinPct, nearMaxPct]
          properties:
            ttlHours: { type: integer }
            postTouchHours: { type: integer }
            nearMinPct: { type: number }
            nearMaxPct: { type: number }
        summary:
          type: object
          additionalProperties: false
          required:
            [
              total,
              waiting,
              touched,
              expired,
              noTarget,
              unavailable,
              complete,
              incomplete,
            ]
          properties:
            total: { type: integer }
            waiting: { type: integer }
            touched: { type: integer }
            expired: { type: integer }
            noTarget: { type: integer }
            unavailable: { type: integer }
            complete: { type: integer }
            incomplete: { type: integer }
        obAnalysis:
          type: object
          additionalProperties: false
          required:
            [
              version,
              rows,
              legacyUnknown,
              proximityCounts,
              finalizedRealized,
              medianTimeToPlus8Minutes,
              medianTimeToPlus10Minutes,
              cohorts,
              policies,
            ]
          description: >
            Versioned OB-only analysis, separate from the original mixed OB/CoinGlass
            waiting target. Finalized realized outcomes are tracker PnL, while policy
            touches and passage timestamps are hypothetical price observations.
          properties:
            version: { type: integer }
            rows: { type: integer }
            legacyUnknown:
              {
                type: integer,
                description: Rows without a compatible frozen OB snapshot; not zero-valued outcomes.,
              }
            proximityCounts:
              type: object
              additionalProperties: false
              required:
                [
                  inside_or_within_1pct,
                  between_1_2pct,
                  beyond_2pct,
                  no_zone,
                  unavailable,
                ]
              properties:
                inside_or_within_1pct: { type: integer }
                between_1_2pct: { type: integer }
                beyond_2pct: { type: integer }
                no_zone: { type: integer }
                unavailable: { type: integer }
            finalizedRealized:
              type: object
              additionalProperties: false
              required:
                [
                  total,
                  above8Pct,
                  above10Pct,
                  stopsAtOrBelowMinus10Pct,
                  exactStopLossCount,
                ]
              properties:
                total:
                  {
                    type: integer,
                    description: Denominator of finalized rows with measurable realized PnL.,
                  }
                above8Pct: { type: integer }
                above10Pct: { type: integer }
                stopsAtOrBelowMinus10Pct: { type: integer }
                exactStopLossCount: { type: integer }
            medianTimeToPlus8Minutes: { type: number, nullable: true }
            medianTimeToPlus10Minutes: { type: number, nullable: true }
            cohorts:
              type: object
              additionalProperties: false
              required:
                [
                  inside_or_within_1pct,
                  between_1_2pct,
                  beyond_2pct,
                  no_zone,
                  unavailable,
                ]
              properties:
                inside_or_within_1pct:
                  $ref: "#/components/schemas/LcWaitingShadowCohortSummary"
                between_1_2pct:
                  $ref: "#/components/schemas/LcWaitingShadowCohortSummary"
                beyond_2pct:
                  $ref: "#/components/schemas/LcWaitingShadowCohortSummary"
                no_zone:
                  $ref: "#/components/schemas/LcWaitingShadowCohortSummary"
                unavailable:
                  $ref: "#/components/schemas/LcWaitingShadowCohortSummary"
            policies:
              type: object
              additionalProperties: false
              required: ["1%", "2%"]
              properties:
                "1%":
                  $ref: "#/components/schemas/LcWaitingShadowPolicyCounts"
                "2%":
                  $ref: "#/components/schemas/LcWaitingShadowPolicyCounts"
        rows:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              [
                trackedSignalId,
                signalId,
                symbol,
                detectedAt,
                originalEntryPrice,
                targetPrice,
                targetSource,
                distancePct,
                status,
                touchAt,
                firstTp10At,
                firstSl10At,
                post24Status,
                originalStatus,
                originalPnlPercent,
                sourceEvidence,
                obHypothesis,
              ]
            properties:
              trackedSignalId: { type: integer }
              signalId: { type: integer, nullable: true }
              symbol: { type: string }
              detectedAt: { type: string, format: date-time }
              originalEntryPrice: { type: number }
              targetPrice: { type: number, nullable: true }
              targetSource: { type: string, nullable: true }
              distancePct: { type: number, nullable: true }
              status: { type: string }
              touchAt: { type: string, format: date-time, nullable: true }
              firstTp10At: { type: string, format: date-time, nullable: true }
              firstSl10At: { type: string, format: date-time, nullable: true }
              post24Status: { type: string }
              originalStatus: { type: string, nullable: true }
              originalPnlPercent: { type: number, nullable: true }
              sourceEvidence: { type: object, additionalProperties: true }
              obHypothesis:
                type: object
                additionalProperties: true
                description: >
                  OB-only snapshot and follow-up stored in sourceEvidence.obHypothesis.
                  Legacy rows use version null and status legacy_unknown; do not treat
                  missing snapshot measurements as zero.
                properties:
                  version: { type: integer, nullable: true }
                  status: { type: string }
                  zone:
                    type: object
                    nullable: true
                    additionalProperties: true
                    properties:
                      high: { type: number }
                      low: { type: number }
                      timeframe: { type: string }
                      createdAt:
                        {
                          oneOf:
                            [
                              { type: string, format: date-time },
                              { type: number },
                              { type: "null" },
                            ],
                        }
                      detectedAt:
                        {
                          oneOf:
                            [
                              { type: string, format: date-time },
                              { type: number },
                              { type: "null" },
                            ],
                        }
                  distancePct: { type: number, nullable: true }
                  insideZone: { type: boolean, nullable: true }
                  proximity:
                    type: string
                    enum:
                      [
                        inside_or_within_1pct,
                        between_1_2pct,
                        beyond_2pct,
                        no_zone,
                        unavailable,
                      ]
                  policies:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        thresholdPct: { type: number, enum: [1, 2] }
                        decision:
                          {
                            type: string,
                            enum: [enter_now, wait, no_target, unavailable],
                          }
                        outcome: { type: string, nullable: true }
                        entryPrice: { type: number, nullable: true }
                  followup:
                    type: object
                    nullable: true
                    additionalProperties: true
                    properties:
                      status: { type: string }
                      outcome: { type: string }
                      touchAt:
                        {
                          oneOf:
                            [
                              { type: string, format: date-time },
                              { type: number },
                              { type: "null" },
                            ],
                        }
                      invalidatedAt:
                        {
                          oneOf:
                            [
                              { type: string, format: date-time },
                              { type: number },
                              { type: "null" },
                            ],
                        }
                      targetPrice: { type: number, nullable: true }
                      fillPrice: { type: number, nullable: true }
                      firstPlus8At:
                        {
                          oneOf:
                            [
                              { type: string, format: date-time },
                              { type: number },
                              { type: "null" },
                            ],
                        }
                      firstPlus10At:
                        {
                          oneOf:
                            [
                              { type: string, format: date-time },
                              { type: number },
                              { type: "null" },
                            ],
                        }
                      firstMinus10At:
                        {
                          oneOf:
                            [
                              { type: string, format: date-time },
                              { type: number },
                              { type: "null" },
                            ],
                        }
                      coverageComplete: { type: boolean, nullable: true }
                  originalEntryComparison:
                    type: object
                    nullable: true
                    additionalProperties: true
                    properties:
                      status: { type: string }
                      firstPlus8At:
                        {
                          oneOf:
                            [
                              { type: string, format: date-time },
                              { type: number },
                              { type: "null" },
                            ],
                        }
                      firstPlus10At:
                        {
                          oneOf:
                            [
                              { type: string, format: date-time },
                              { type: number },
                              { type: "null" },
                            ],
                        }
                      firstMinus10At:
                        {
                          oneOf:
                            [
                              { type: string, format: date-time },
                              { type: number },
                              { type: "null" },
                            ],
                        }
                      peakPct24h: { type: number, nullable: true }
