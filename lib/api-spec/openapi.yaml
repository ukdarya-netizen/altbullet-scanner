openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: BingX Alpha Scanner API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: scanner
    description: BingX scanner operations
  - name: signals
    description: Alpha signal operations
  - name: settings
    description: Scanner settings
  - name: subscribers
    description: Telegram bot subscribers
  - name: liq-cascade
    description: Layer 10 Liquidation Cascade Watch — independent dump detector
  - name: ta-scanner
    description: TA Scanner — мульти-TF MA/EMA/MACD/TD/ATR для всех токенов
  - name: trading-bot
    description: Private read-only position reconciliation for the trading receiver

paths:
  /trading/position-sync:
    get:
      operationId: getTradingPositionSync
      tags: [trading-bot]
      summary: Read Bullet state for signals accepted by the trading receiver
      description: >
        Machine-only, read-only. A delivered signal proves that the receiver
        enqueued it, not that it opened or closed a trade. All prices, stops,
        and PnL in this response belong to Bullet's tracker; the receiver must
        reconcile its own fills and quotes independently. Follow nextAfterId
        until null to collect the whole snapshot. Missing sourceStatus means
        the tracked row is unavailable and must not be treated as a close.
      security:
        - tradingBotToken: []
      parameters:
        - name: afterId
          in: query
          description: Last numeric Bullet signal ID from the preceding page
          schema: { type: integer, minimum: 0, maximum: 2147483647, default: 0 }
      responses:
        "200":
          description: Paginated snapshot of accepted signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingPositionSync"
        "401": { description: Missing or invalid trading bot token }
        "400": { description: Invalid cursor }
        "503": { description: Position sync unavailable or not configured }
  /admin/tracker/lc-waiting-shadow:
    get:
      operationId: getLcWaitingShadow
      summary: Read-only LC waiting-zone shadow observations
      security:
        - adminToken: []
      responses:
        "200":
          description: Current shadow-only waiting and first-passage observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LcWaitingShadowReport"
        "401": { description: Unauthorized }
        "503": { description: Shadow report unavailable }
  /admin/tracker/lc-repeat-watch:
    get:
      operationId: getLcRepeatWatch
      summary: Read-only repeated Liquidation Cascade signal history
      description: >
        Owner-only descriptive watch of symbols with repeated LC signals in the
        trailing 30 days. It uses persisted decision-time map captures only,
        never current heatmaps or inferred clusters, and does not alter trades,
        entries, exits, scanners, or signal decisions.
      security:
        - adminToken: []
      responses:
        "200":
          description: Repeated-symbol signal sequence and evidence cohorts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LcRepeatWatchReport"
        "401": { description: Unauthorized }
        "503": { description: Repeat watch unavailable }
  /admin/tracker/lc-rapid-rebound:
    get:
      operationId: getLcRapidRebound
      summary: Observe fast 5m candle rebounds after LC liquidation watches
      description: >
        Admin-only, observation-only BingX perpetual candles and frozen
        liquidation-watch snapshots. Not a trading gate or causal claim.
      security:
        - adminToken: []
      responses:
        "200":
          description: Closed-candle forward cohorts and source coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LcRapidReboundReport"
        "401": { description: Unauthorized }
        "503": { description: Observation report unavailable }
  /admin/tracker/reentry-shadow:
    get:
      summary: Shadow-only re-entry telemetry
      security:
        - adminToken: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Immutable re-entry shadow events and aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReentryShadowAnalytics"
        "401": { description: Unauthorized }
  /admin/tracker/indicator-target-observations:
    get:
      operationId: getAdminTrackerIndicatorTargetObservations
      summary: Owner-only indicator-target observation experiment monitoring
      description: >
        Read-only monitoring for the +8%, +12%, and +16% observational target
        hypotheses. Reports durable experiment enrollment, target and follow-up
        states, exact complete 72h outcomes, entry indicator provenance, durable
        database freshness, process-local worker health, and bounded recent rows.
        This is observation-only and must not be used as a take-profit recommendation.
      security:
        - adminToken: []
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum recent observation rows to return (default 50, max 200)
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Experiment monitoring report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndicatorTargetObservationReport"
        "400": { description: Invalid limit }
        "401": { description: Unauthorized }
        "503": { description: Experiment monitoring unavailable }
  /bootstrap-errors:
    post:
      operationId: reportBootstrapError
      tags: [health]
      summary: Report an anonymous sanitized dashboard bootstrap failure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapErrorReport"
      responses:
        "202":
          description: Error report accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorAccepted"
        "400":
          description: Invalid report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /client-errors:
    post:
      operationId: reportClientError
      tags: [health]
      summary: Report a sanitized authenticated dashboard error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientErrorReport"
      responses:
        "202":
          description: Error report accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientErrorAccepted"
        "400":
          description: Invalid report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /scanner/status:
    get:
      operationId: getScannerStatus
      tags: [scanner]
      summary: Get scanner status
      description: Returns current scanner status and stats
      responses:
        "200":
          description: Scanner status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScannerStatus"

  /scanner/start:
    post:
      operationId: startScanner
      tags: [scanner]
      summary: Start scanner
      description: Start the alpha signal scanner
      responses:
        "200":
          description: Scanner started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  /scanner/stop:
    post:
      operationId: stopScanner
      tags: [scanner]
      summary: Stop scanner
      description: Stop the alpha signal scanner
      responses:
        "200":
          description: Scanner stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  /scanner/candidates:
    get:
      operationId: getScannerCandidates
      tags: [scanner]
      summary: Get scanner candidates
      description: Returns current prescan hot list and OI watch queue
      responses:
        "200":
          description: Scanner candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScannerCandidates"

  /scanner/breakout-analysis:
    get:
      operationId: getBreakoutAnalysis
      tags: [scanner]
      summary: Analyze technical breakouts for current candidates
      description: Dashboard-member 4H structure analysis over closed BingX candles. It does not change signal firing conditions.
      responses:
        "200":
          description: Current technical breakout classifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakoutAnalysisList"
        "401":
          description: Dashboard authorization required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scanner/breakout-analysis/{symbol}:
    get:
      operationId: getBreakoutAnalysisDetail
      tags: [scanner]
      summary: Get technical breakout chart data for a symbol
      description: "Dashboard-member chart-ready view of the live Stealth Breakout sequence: frozen 4H resistance, closed 4H breakout, and 30m entry refinement; 1H is optional context only."
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Z0-9-]{3,50}$"
      responses:
        "200":
          description: Technical breakout detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakoutAnalysisDetail"
        "400":
          description: Invalid symbol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Dashboard authorization required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scanner/breakout-replay:
    get:
      operationId: getBreakoutReplay
      tags: [scanner]
      summary: Replay historical Stealth Breakout events
      description: "Dashboard-member replay over closed BingX OHLCV candles. Each event is evaluated at a closed 4H candle crossing frozen resistance with 30m entry refinement; 1H is optional context only, future returns are reported separately, and historical flow gates are explicitly unavailable."
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            pattern: "^[A-Z0-9-]{3,50}$"
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Historical Stealth replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakoutReplay"
        "400":
          description: Invalid replay range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Dashboard authorization required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Historical market data unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scanner/symbol-history:
    get:
      operationId: getScannerSymbolHistory
      tags: [scanner]
      summary: Get symbol history
      description: Returns prescan cycle history and OI Watch entry history for a given symbol
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Symbol history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymbolHistory"

  /scanner/symbol-status-history:
    get:
      operationId: getScannerSymbolStatusHistory
      tags: [scanner]
      summary: Get member-safe per-symbol scanner status history
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OI Watch statuses and approved prescan observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberSymbolStatusHistory"

  /scanner/symbol-indicator-history:
    get:
      operationId: getScannerSymbolIndicatorHistory
      tags: [scanner]
      summary: Recorded indicator readings for the in-app token chart
      description: Member-only prescan observations from the rolling 14-day archive and signal-time RSI/Williams readings. Missing samples are not reconstructed.
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            pattern: "^[A-Z0-9]{2,30}-USDT$"
      responses:
        "200":
          description: Recorded indicator observations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SymbolIndicatorHistory"
        "401":
          description: Dashboard authorization required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /scanner/inspect:
    get:
      operationId: getScannerInspect
      tags: [scanner]
      summary: Inspect symbols
      description: Returns a live metrics snapshot (OI/CVD/volMult/taker + active OI Watch + active tracked signal) for a comma-separated list of symbols. Used by the manual инспектор widget.
      parameters:
        - name: symbols
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated list of symbols, e.g. "SOL-USDT,ETH-USDT"
      responses:
        "200":
          description: Inspection snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectResult"

  /scanner/scan-now:
    post:
      operationId: scanNow
      tags: [scanner]
      summary: Trigger manual scan
      description: Trigger an immediate scan of all markets
      responses:
        "200":
          description: Scan triggered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"

  /signals:
    get:
      operationId: getSignals
      tags: [signals]
      summary: Get signals
      description: Returns list of detected alpha signals
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: type
          in: query
          schema:
            type: string
            enum:
              [
                volume_spike,
                oi_increase,
                funding_rate,
                alpha,
                super_alpha,
                short_sniper,
                all,
              ]
            default: all
        - name: pattern
          in: query
          schema:
            type: string
            description: Filter by sentimentKey (pattern key)
        - name: scope
          in: query
          description: real returns only signals linked to a tracked trading position; all includes raw detector rows
          schema:
            type: string
            enum: [real, all]
            default: all
      responses:
        "200":
          description: List of signals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalList"

  /signals/summary:
    get:
      operationId: getSignalsSummary
      tags: [signals]
      summary: Get signals summary
      description: Returns aggregated statistics about detected signals
      responses:
        "200":
          description: Signals summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalsSummary"

  /signals/{id}:
    get:
      operationId: getSignal
      tags: [signals]
      summary: Get signal by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Signal details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Signal"
        "404":
          description: Signal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get scanner settings
      description: Returns current scanner configuration
      responses:
        "200":
          description: Scanner settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

    put:
      operationId: updateSettings
      tags: [settings]
      summary: Update scanner settings
      description: Update scanner configuration parameters
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsBody"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"

  /subscribers:
    get:
      operationId: getSubscribers
      tags: [subscribers]
      summary: Get subscribers list
      description: Returns list of Telegram bot subscribers
      responses:
        "200":
          description: Subscribers list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriberList"

  /tracker/journal:
    get:
      operationId: getTrackerJournal
      tags: [signals]
      summary: Get trading journal data
      description: Returns aggregated performance stats, per-pattern breakdown, and recent closed trades
      parameters:
        - in: query
          name: from
          schema:
            type: string
          required: false
          description: "Filter by detected_at >= from (ISO date, e.g. 2025-06-01)"
      responses:
        "200":
          description: Trading journal data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalStats"

  /tracker/signal-history:
    get:
      operationId: getSignalHistory
      tags: [signals]
      summary: Get full tracked signal history
      description: Returns paginated active and closed tracked signals with entry, exit, and observed drawdown audit data.
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum:
              [
                all,
                open,
                active,
                in_run,
                closed,
                win_rate,
                profit,
                stop_loss,
                cancelled,
                breakeven,
                bu_stop,
                expired,
                bu_stop_5,
                bu_stop_8,
                bu_stop_10,
              ]
          required: false
        - in: query
          name: pattern
          schema:
            type: string
          required: false
        - in: query
          name: sort
          schema:
            type: string
            enum: [detectedAt, closedAt, pattern, pnl_asc, pnl_desc]
          required: false
        - in: query
          name: from
          schema:
            type: string
            format: date-time
          required: false
          description: Inclusive lower bound for the selected date basis.
        - in: query
          name: to
          schema:
            type: string
            format: date-time
          required: false
          description: Exclusive upper bound for the selected date basis.
        - in: query
          name: dateBasis
          schema:
            type: string
            enum: [detected, closed]
            default: detected
          required: false
          description: Use detected_at or closed_at for from/to filtering.
        - in: query
          name: pnlSign
          schema:
            type: string
            enum: [positive, negative]
          required: false
          description: Keep only rows whose measurable normalized PnL is positive or negative.
        - in: query
          name: metric
          schema:
            type: string
            enum:
              [
                win_rate,
                measurable_pnl,
                current_measurable_pnl,
                avg_profit,
                avg_loss,
                best_trade,
                worst_trade,
                avg_peak,
                monthly_avg_peak,
                monthly_pattern_avg_peak,
                monthly_pattern_duration,
                current_last_signal,
                last_signal,
              ]
          required: false
          description: Named journal metric cohort; applies the same status/PnL predicate as the aggregate.
        - in: query
          name: scope
          schema:
            type: string
            enum: [archive]
          required: false
          description: Archive scope for monthly/daily detail; protected months require owner authorization.
        - in: query
          name: symbol
          schema:
            type: string
          required: false
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
          required: false
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
          required: false
      responses:
        "200":
          description: Paginated tracked signal history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalHistoryResponse"

  /tracker/altbullet-indicator-analysis:
    get:
      operationId: getAltBulletIndicatorAnalysis
      tags: [signals]
      summary: Analyze versioned observational AltBullet snapshots
      description: Defaults to altbullet-neon-v7-observational. Cohorts are never mixed; availableVersions lists immutable historical cohorts.
      parameters:
        - in: query
          name: pattern
          schema: { type: string }
        - in: query
          name: version
          schema: { type: string }
      responses:
        "200":
          description: Version-scoped observational outcome aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AltBulletIndicatorAnalysisResponse"

  /tracker/trailing-analysis:
    get:
      operationId: getTrailingAnalysis
      tags: [signals]
      summary: Compare observational trailing replays and candidate policies
      description: Returns observation-only trailing replay profiles and candidate comparisons by pattern. These replays and comparisons never alter real exits or signal gates; the live impulse_runner_v1 policy applies only to newly policy-stamped positions.
      parameters:
        - in: query
          name: pattern
          schema:
            type: string
          required: false
      responses:
        "200":
          description: Observation-only trailing replays and candidate comparisons, with live policy metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrailingAnalysisResponse"

  /tracker/monthly-stats:
    get:
      operationId: getTrackerMonthlyStats
      tags: [signals]
      summary: Get monthly performance stats
      description: Returns trading stats grouped by calendar month
      responses:
        "200":
          description: Monthly stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyStatsData"

  /tracker/daily-stats:
    get:
      operationId: getTrackerDailyStats
      tags: [signals]
      summary: Get daily performance stats
      description: Returns trading stats grouped by calendar day in Asia/Dubai, using either signal entry or close date
      parameters:
        - in: query
          name: basis
          required: false
          schema:
            type: string
            enum: [entry, close]
            default: entry
          description: Calendar day basis; BTC values use the matching entry-time or close-time snapshot
      responses:
        "200":
          description: Daily stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyStatsData"

  /tracker/btc-analysis:
    get:
      operationId: getBtcAnalysis
      tags: [signals]
      summary: Get owner-only BTC context coverage and outcome analysis
      description: Returns descriptive BTC 24h context collected at entry and close for tracked alt signals, plus BTC positions. This endpoint is owner-only and does not change scanner gates or trading decisions.
      responses:
        "200":
          description: BTC context and outcome analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BtcAnalysisResponse"
        "403":
          description: Owner authorization required

  /btc-cross-alerts:
    get:
      operationId: getBtcCrossAlerts
      tags: [signals]
      summary: Get owner BTC/dominance crossing alerts
      responses:
        "200":
          description: Persisted crossing events and unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BtcCrossAlertsResponse"
        "403":
          description: Owner authorization required

  /btc-cross-alerts/{id}/read:
    post:
      operationId: markBtcCrossAlertRead
      tags: [signals]
      summary: Mark an owner BTC/dominance crossing alert as read
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Read state saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: Owner authorization required
        "404":
          description: Alert not found

  /subscribers/stats:
    get:
      operationId: getSubscriberStats
      tags: [subscribers]
      summary: Get subscriber statistics
      description: Returns subscriber count and growth stats
      responses:
        "200":
          description: Subscriber stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriberStats"

  /scanner/whale-alerts:
    get:
      operationId: getScannerWhaleAlerts
      tags: [scanner]
      summary: Whale Alert pool (Layer 11)
      description: Returns active and recent Hyperliquid whale alert pool entries with per-cycle live metrics
      responses:
        "200":
          description: Whale alert pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhaleAlertPoolResponse"

  /scanner/bot-health:
    get:
      operationId: getBotHealth
      tags: [scanner]
      summary: Bot health dashboard
      description: Агрегированные индикаторы работоспособности — сканер, CoinGlass, фоновые джобы, БД
      responses:
        "200":
          description: Bot health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotHealthStatus"

  /scanner/inflow-outflow:
    get:
      operationId: getScannerInflowOutflow
      tags: [scanner]
      summary: Layer 14 — Exchange Inflow/Outflow pool
      description: "On-chain outflow кандидаты: токены с крупным оттоком с бирж (вывод ≥$2M = накопление умных денег). Данные: CoinGlass exchange/chain/tx/list + exchange_assets_transparency/list."
      responses:
        "200":
          description: Inflow/Outflow pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InflowOutflowResponse"

  /telegram/webhook:
    post:
      operationId: telegramWebhook
      tags: [subscribers]
      summary: Telegram webhook
      description: Handles incoming Telegram bot updates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok

  /scanner/growth-leaders:
    get:
      operationId: getGrowthLeaders
      tags: [scanner]
      summary: Get BingX growth leaders snapshot from growth_leader_log
      parameters:
        - name: hours
          in: query
          required: false
          schema:
            type: integer
          description: "History window in hours (default 24, max 720 when retro=true)"
        - name: snapshot
          in: query
          required: false
          schema:
            type: string
          description: "Pass 'all' for full history, default is latest snapshot only"
        - name: retro
          in: query
          required: false
          schema:
            type: string
          description: "Pass 'true' to show retrospective data (retro=true rows, up to 30d)"
      responses:
        "200":
          description: Growth leaders snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrowthLeadersResponse"

  /scanner/overheat-log:
    get:
      operationId: getOverheatLog
      tags: [scanner]
      summary: Get tokens kicked from prescan by the overheat filter (price24h > 40%)
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
          description: "History window in days (default 7, max 30)"
      responses:
        "200":
          description: Overheat log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverheatLogResponse"

  /liq-cascade:
    get:
      operationId: getLiqCascade
      tags: [liq-cascade]
      summary: Get Layer 10 Liquidation Cascade Watch entries
      description: Returns active watching entries and recent history for the independent dump detector
      parameters:
        - name: hours
          in: query
          required: false
          schema:
            type: integer
          description: "History window in hours (default 24, max 168)"
      responses:
        "200":
          description: Liq cascade watch entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiqCascadeResponse"

  /ta-scanner:
    get:
      operationId: getTaScanner
      tags: [ta-scanner]
      summary: Get TA Scanner data (MA/EMA/MACD/TD/ATR for all tokens)
      description: Multi-timeframe technical analysis snapshot, refreshed every 5 minutes
      parameters:
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: "Sort: td1h_abs | td4h_abs | td1d_abs | atr1h_desc (default: td1h_abs)"
        - name: filter
          in: query
          required: false
          schema:
            type: string
          description: "Filter: all | td_buy | td_sell | td_reversal (default: all)"
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: "Symbol text search (case-insensitive)"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: "Max entries (default 500, max 1000)"
      responses:
        "200":
          description: TA Scanner entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaScannerResponse"

components:
  securitySchemes:
    tradingBotToken:
      type: apiKey
      in: header
      name: x-trading-token
    adminToken:
      type: apiKey
      in: header
      name: x-admin-token
  schemas:
    TradingPositionSync:
      type: object
      additionalProperties: false
      required: [asOf, positions, nextAfterId]
      properties:
        asOf: { type: string, format: date-time }
        nextAfterId: { type: ["integer", "null"] }
        positions:
          type: array
          items: { $ref: "#/components/schemas/TradingPositionSyncItem" }
    TradingPositionSyncItem:
      type: object
      additionalProperties: false
      required:
        - sourceSignalId
        - signalAt
        - botEnqueuedAt
        - symbol
        - initialStopPrice
        - sourceStatus
        - sourceUpdatedAt
        - sourceClosedAt
        - sourceEntryPrice
        - sourceExitPrice
        - sourcePnlPercent
        - sourcePeakPrice
        - sourceStopLossPrice
        - sourceTrailingStopLevel
        - sourceLastMilestone
        - sourceCancelReason
        - sourceAction
      properties:
        sourceSignalId: { type: string, pattern: "^cab-signal-[0-9]+$" }
        signalAt: { type: string, format: date-time }
        botEnqueuedAt: { type: ["string", "null"], format: date-time }
        symbol: { type: ["string", "null"] }
        initialStopPrice: { type: ["string", "null"] }
        sourceStatus: { type: ["string", "null"] }
        sourceUpdatedAt: { type: ["string", "null"], format: date-time }
        sourceClosedAt: { type: ["string", "null"], format: date-time }
        sourceEntryPrice: { type: ["number", "null"] }
        sourceExitPrice: { type: ["number", "null"] }
        sourcePnlPercent: { type: ["number", "null"] }
        sourcePeakPrice: { type: ["number", "null"] }
        sourceStopLossPrice: { type: ["number", "null"] }
        sourceTrailingStopLevel: { type: ["number", "null"] }
        sourceLastMilestone: { type: ["integer", "null"] }
        sourceCancelReason: { type: ["string", "null"] }
        sourceAction:
          type: string
          enum: [hold, close, review, unknown]
          description: >
            close = Bullet closed the position (profit, stop_loss, bu_stop,
            breakeven, expired); close the remaining position. hold = still
            open. review = cancelled/reclassified (dashboard administration,
            not an exit); compare with the exchange, do not close blindly.
            unknown = tracked row missing.
    BootstrapErrorReport:
      type: object
      additionalProperties: false
      required:
        - code
        - route
        - appVersion
        - browserFamily
        - browserVersion
      properties:
        code:
          type: string
          enum: [bootstrap_timeout, app_bootstrap_failed, browser_unsupported]
        route:
          type: string
          minLength: 1
          maxLength: 160
        appVersion:
          type: string
          minLength: 1
          maxLength: 80
        browserFamily:
          type: string
          enum: [Chrome, Safari, Firefox, Edge, Samsung Internet, Opera, Other]
        browserVersion:
          type: string
          maxLength: 24
          pattern: "^[0-9]{1,4}(?:\\.[0-9]{1,4}){0,3}$|^unknown$"

    ClientErrorReport:
      type: object
      additionalProperties: false
      required:
        - kind
        - route
        - appVersion
        - browserFamily
        - fingerprint
        - occurredAt
      properties:
        kind:
          type: string
          enum: [render, session_check, window_error, unhandled_rejection]
        route:
          type: string
          minLength: 1
          maxLength: 160
        appVersion:
          type: string
          minLength: 1
          maxLength: 80
        browserFamily:
          type: string
          enum: [Chrome, Safari, Firefox, Edge, Samsung Internet, Opera, Other]
        fingerprint:
          type: string
          pattern: "^[a-f0-9]{8}$"
        occurredAt:
          type: string
          format: date-time
        message:
          type: string
          maxLength: 240
        component:
          type: string
          maxLength: 120
        httpStatus:
          type: integer
          minimum: 0
          maximum: 599

    ClientErrorAccepted:
      type: object
      required:
        - accepted
      properties:
        accepted:
          type: boolean

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ScannerStatus:
      type: object
      properties:
        running:
          type: boolean
        lastScanAt:
          type: string
          nullable: true
        scanStartedAt:
          type: string
          nullable: true
        nextScanAt:
          type: string
          nullable: true
        totalSignals:
          type: integer
        signalsToday:
          type: integer
        marketsScanned:
          type: integer
        telegramConnected:
          type: boolean
        bingxConnected:
          type: boolean
        coinglassConnected:
          type: boolean
        coinalyzeConnected:
          type: boolean
        coinGeckoConnected:
          type: boolean
        coinPaprikaConnected:
          type: boolean
        scanIntervalMs:
          type: integer
        isScanning:
          type: boolean
        lastScanDurationMs:
          type: integer
          nullable: true
        lastFailureAt:
          type: string
          nullable: true
        lastFailureReason:
          type: string
          nullable: true
        retryAt:
          type: string
          nullable: true
        activeMarketLeaseExpiresAt:
          type: string
          nullable: true
        cgLatency:
          nullable: true
          type: object
          properties:
            timeoutPct:
              type: integer
            p50Ms:
              type: integer
            p95Ms:
              type: integer
            maxMs:
              type: integer
            req:
              type: integer
            reqPerMin:
              type: integer
            elLagP95Ms:
              type: integer
            windowMin:
              type: number
          required:
            - timeoutPct
            - p50Ms
            - p95Ms
            - maxMs
            - req
            - reqPerMin
            - elLagP95Ms
            - windowMin
      required:
        - running
        - lastScanAt
        - scanStartedAt
        - nextScanAt
        - totalSignals
        - signalsToday
        - marketsScanned
        - telegramConnected
        - bingxConnected
        - coinglassConnected
        - coinalyzeConnected
        - coinGeckoConnected
        - coinPaprikaConnected
        - scanIntervalMs
        - isScanning
        - lastScanDurationMs
        - lastFailureAt
        - lastFailureReason
        - retryAt
        - activeMarketLeaseExpiresAt

    BotHealthStatus:
      type: object
      properties:
        scanner:
          type: object
          properties:
            running:
              type: boolean
            isScanning:
              type: boolean
            lastScanAt:
              type: string
              nullable: true
            nextScanAt:
              type: string
              nullable: true
            lastScanDurationMs:
              type: integer
              nullable: true
            marketsScanned:
              type: integer
              nullable: true
            scanIntervalMs:
              type: integer
          required:
            - running
            - isScanning
            - lastScanAt
            - nextScanAt
            - lastScanDurationMs
            - marketsScanned
            - scanIntervalMs
        cgLatency:
          nullable: true
          type: object
          properties:
            timeoutPct:
              type: integer
            p50Ms:
              type: integer
            p95Ms:
              type: integer
            maxMs:
              type: integer
            req:
              type: integer
            reqPerMin:
              type: integer
            elLagP95Ms:
              type: integer
            windowMin:
              type: number
          required:
            - timeoutPct
            - p50Ms
            - p95Ms
            - maxMs
            - req
            - reqPerMin
            - elLagP95Ms
            - windowMin
        connections:
          type: object
          properties:
            bingx:
              type: boolean
            telegram:
              type: boolean
            coinglass:
              type: boolean
              nullable: true
            coinalyze:
              type: boolean
              nullable: true
            coinGecko:
              type: boolean
              nullable: true
            coinPaprika:
              type: boolean
              nullable: true
          required:
            - bingx
            - telegram
        jobs:
          type: object
          additionalProperties:
            type: object
            properties:
              label:
                type: string
              intervalMs:
                type: integer
              lastRunAt:
                type: integer
                nullable: true
              overdueMs:
                type: integer
                nullable: true
            required:
              - label
              - intervalMs
              - lastRunAt
              - overdueMs
        db:
          type: object
          properties:
            ok:
              type: boolean
            pingMs:
              type: integer
              nullable: true
          required:
            - ok
            - pingMs
        oiWatch:
          type: object
          properties:
            insertErrors:
              type: integer
            cgTimeoutsLastScan:
              type: integer
          required:
            - insertErrors
            - cgTimeoutsLastScan
        telegramDeliveries:
          type: array
          description: Aggregate delivery states only; never includes recipients or message content.
          items:
            type: object
            properties:
              recipientRole:
                type: string
                enum: [channel, direct_chat]
              status:
                type: string
              reason:
                type: string
              queueClass:
                type: string
                enum: [active, historical]
              rows:
                type: integer
              oldestAt:
                type: string
                nullable: true
            required:
              - recipientRole
              - status
              - reason
              - queueClass
              - rows
              - oldestAt
      required:
        - scanner
        - connections
        - jobs
        - db
        - oiWatch
        - telegramDeliveries

    ActionResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message

    ScanResult:
      type: object
      properties:
        success:
          type: boolean
        signalsFound:
          type: integer
        marketsScanned:
          type: integer
        durationMs:
          type: integer
      required:
        - success
        - signalsFound
        - marketsScanned
        - durationMs

    Signal:
      type: object
      properties:
        id:
          type: integer
        symbol:
          type: string
        type:
          type: string
          enum:
            [
              volume_spike,
              oi_increase,
              funding_rate,
              alpha,
              super_alpha,
              short_sniper,
              strict_alpha,
            ]
        value:
          type: number
        threshold:
          type: number
        price:
          type: number
        priceChangePercent:
          type: number
        volume24h:
          type: number
        avgVolume:
          type: number
        openInterest:
          type: number
          nullable: true
        oiChangePercent:
          type: number
          nullable: true
        fundingRate:
          type: number
          nullable: true
        detectedAt:
          type: string
        tradingViewUrl:
          type: string
        trackedStatus:
          type: string
          nullable: true
          description: Current status in tracked_signals table (active, cancelled, profit, stop_loss, etc.)
        trackedRunnerState:
          type: string
          nullable: true
          enum: [open, closed]
          description: Runner lifecycle state for frozen 80/20 Impulse Buy positions
        trackedCoreClosedAt:
          type: string
          nullable: true
          description: ISO timestamp when the 80% core closed; a non-null value with an open runner means only 20% remains live
        trackedPnl:
          type: number
          nullable: true
          description: P&L % from tracked_signals (set when position closes)
        telegramDeliveryStatus:
          type: string
          nullable: true
          description: Durable Telegram delivery event status for this primary signal; null for legacy rows without delivery telemetry
        trackedStopPrice:
          type: number
          nullable: true
          description: Personal stop-loss price from CoinGlass liquidation heatmap (long-liq cluster below entry minus 2%)
        trackedStopPct:
          type: number
          nullable: true
          description: Personal stop depth in % from entry (positive number; null = standard -10%)
        trackedStopSource:
          type: string
          nullable: true
          description: Stop source — "liq_heatmap" (personal) or "standard" (-10% fallback)
        trackedTakeTargets:
          type: array
          nullable: true
          description: Take-profit targets from short-liq clusters above entry (nearest first)
          items:
            type: object
            properties:
              price:
                type: number
              pctFromEntry:
                type: number
              liqUsd:
                type: number
            required:
              - price
              - pctFromEntry
              - liqUsd
        sentimentKey:
          type: string
          nullable: true
          description: Pattern key (e.g. impulse_buy, stealth_breakout, neon_support_bounce, price_led_momentum, balanced_grind, liquidation_cascade)
        alphaScore:
          type: integer
          nullable: true
          description: Alpha score 1-10
      required:
        - id
        - symbol
        - type
        - value
        - threshold
        - price
        - priceChangePercent
        - volume24h
        - avgVolume
        - openInterest
        - oiChangePercent
        - fundingRate
        - detectedAt
        - tradingViewUrl
        - trackedStatus
        - trackedRunnerState
        - trackedCoreClosedAt
        - trackedPnl
        - telegramDeliveryStatus

    SignalList:
      type: object
      properties:
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
        total:
          type: integer
      required:
        - signals
        - total

    SignalsSummary:
      type: object
      properties:
        totalSignals:
          type: integer
        signalsToday:
          type: integer
        volumeSpikes:
          type: integer
        oiIncreases:
          type: integer
        fundingRateAlerts:
          type: integer
        topSymbols:
          type: array
          items:
            type: object
            properties:
              symbol:
                type: string
              count:
                type: integer
            required:
              - symbol
              - count
      required:
        - totalSignals
        - signalsToday
        - volumeSpikes
        - oiIncreases
        - fundingRateAlerts
        - topSymbols

    Settings:
      type: object
      properties:
        volumeMultiplier:
          type: number
        oiChangePercent:
          type: number
        fundingRateThreshold:
          type: number
        scanIntervalMs:
          type: integer
        telegramEnabled:
          type: boolean
        maxSymbols:
          type: integer
        channelId:
          type: string
          nullable: true
      required:
        - volumeMultiplier
        - oiChangePercent
        - fundingRateThreshold
        - scanIntervalMs
        - telegramEnabled
        - maxSymbols

    UpdateSettingsBody:
      type: object
      properties:
        volumeMultiplier:
          type: number
        oiChangePercent:
          type: number
        fundingRateThreshold:
          type: number
        scanIntervalMs:
          type: integer
        telegramEnabled:
          type: boolean
        maxSymbols:
          type: integer
        channelId:
          type: string
          nullable: true

    PrescanCandidate:
      type: object
      properties:
        symbol:
          type: string
        cycleCount:
          type: integer
        bestRank:
          type: integer
        lastPrice24h:
          type: number
        lastPrice:
          type: number
        lastScore:
          type: number
        firstSeenAt:
          type: number
        lastCvdOk:
          type: boolean
          nullable: true
        lastNetBuyPct:
          type: number
          nullable: true
        lastOi5m:
          type: number
          nullable: true
        lastOi30m:
          type: number
          nullable: true
        lastOi1h:
          type: number
          nullable: true
        lastOi4h:
          type: number
          nullable: true
        lastOi24h:
          type: number
          nullable: true
        priceMovePct:
          type: number
          description: Price drift since first seen in prescan (%)
          nullable: true
        lastPrice1h:
          type: number
          description: Price change over the last 1h (2x30m candles), from BingX klines (%)
          nullable: true
        lastCvd15m:
          type: boolean
          nullable: true
          description: Spot CVD 15m verdict (3 of 4 periods positive)
        lastCvd1h:
          type: boolean
          nullable: true
          description: Spot CVD 1h verdict
        lastCvd4h:
          type: boolean
          nullable: true
          description: Spot CVD 4h verdict
        cgTimedOut:
          type: boolean
          nullable: true
          description: true = last CoinGlass request timed out (not a true BingX-only token)
        firstPrice:
          type: number
          nullable: true
          description: Price when first seen in prescan (entry price)
        lastOiAt:
          type: number
          nullable: true
          description: Unix ms timestamp of last OI data update for this token (null = never scanned with live OI)
        spotVol24h:
          type: number
          nullable: true
          description: Spot volume 24h (USD, CoinGlass aggregated) from spot pool cache; null if not yet fetched
        spotTakerNetBuy:
          type: number
          nullable: true
          description: Spot taker net buy % (last 5m candle) from Binance or BingX spot
        spotTakerDominance:
          type: string
          nullable: true
          description: "buy | sell | neutral"
        spotTakerExchange:
          type: string
          nullable: true
          description: "Exchange source for spot taker data: Binance or BingX"
        mcapUsd:
          type: number
          nullable: true
          description: Market cap USD from CoinGecko (via spot pool cache)
        lastAvgVol:
          type: number
          nullable: true
          description: Average BingX futures 30m candle volume in USDT (from klines history)
        lastVolMult:
          type: number
          nullable: true
          description: BingX futures volume multiplier (current 30m / average) from last scan cycle
        spotVolMult:
          type: number
          nullable: true
          description: Spot volume 1h multiplier vs 5-cycle average (lastSpotVol1h / spotVolAvg1h); null if < 2 cycles
        prevSpotVolMult:
          type: number
          nullable: true
          description: Previous cycle spot volume 1h multiplier (prevSpotVol1h / spotVolAvg1h); null if < 2 cycles
        spotVolCycles:
          type: integer
          description: Number of cycles spot volume has been collected (0 = no data yet)
        lastSpotNetBuy1h:
          type: number
          nullable: true
          description: Spot net buy % over last 1h (buy-sell)/(buy+sell)*100 from CoinGlass pairs-markets
        lastSpotVol1h:
          type: number
          nullable: true
          description: Raw spot volume 1h USD (sum across all exchanges, CoinGlass pairs-markets)
        lastSpotVol4h:
          type: number
          nullable: true
          description: Raw spot volume 4h USD (sum across all exchanges, CoinGlass pairs-markets)
        cvd1h:
          type: boolean
          nullable: true
          description: True if futures taker CVD is positive over last 1h (all exchanges net buy dominant)
        cvd4h:
          type: boolean
          nullable: true
          description: True if futures taker CVD is positive over last 4h
        layers:
          type: array
          items:
            type: string
          description: "Prescan layers this token entered through: WL, L1, L2, L3, L4, L5, L7, L8"
        lastSkipReason:
          type: string
          nullable: true
          description: "Reason pattern was skipped in the last scan cycle: no_pattern | no_cg_data | oi_low | late_pump | cooldown"
        futVolUsd24h:
          type: number
          nullable: true
          description: "Futures volume 24h USD (Binance+OKX+Bybit aggregate, CoinGlass futures_spot_volume_ratio)"
        spotVolUsd24h:
          type: number
          nullable: true
          description: "Spot volume 24h USD (Binance+OKX+Bybit aggregate, CoinGlass futures_spot_volume_ratio)"
        futSpotRatio:
          type: number
          nullable: true
          description: "Futures / spot volume ratio (futVolUsd24h / spotVolUsd24h)"
        futVolPctMcap:
          type: number
          nullable: true
          description: "Futures volume as % of market cap (futVolUsd24h / mcapUsd * 100)"
        spotVolPctMcap:
          type: number
          nullable: true
          description: "Spot volume as % of market cap (spotVolUsd24h / mcapUsd * 100)"
        whaleIndex:
          type: number
          nullable: true
          description: "Per-token CoinGlass Whale Index (Binance futures, 4h); populated for OI Watch tokens + top prescan; null if not yet fetched"
        oiAccel30m:
          type: number
          nullable: true
          description: "OI 30m acceleration ratio (lastOi30m / prevOi30m); null if previous cycle OI was 0 or unavailable"
        lastCvd30m:
          type: boolean
          nullable: true
          description: "Spot CVD 30m verdict (last 3 periods net buy dominant)"
        isBingxExclusive:
          type: boolean
          nullable: true
          description: "true = token is BingX-only (not on CG futures, not on Binance spot); false = has wider coverage; null = listing data not yet loaded"
        isBinanceSpotListed:
          type: boolean
          nullable: true
          description: "true = token is listed on Binance spot (from CoinGlass exchange-pairs); null = listing data not yet loaded (fail-open)"
        hasCgFutures:
          type: boolean
          nullable: true
          description: "true = token has CoinGlass futures OI coverage (from CG supported-coins); null = data not yet loaded"
      required:
        - symbol
        - cycleCount
        - bestRank
        - lastPrice24h
        - lastPrice
        - lastScore
        - firstSeenAt

    OiWatchEntry:
      type: object
      properties:
        id:
          type: integer
        symbol:
          type: string
        status:
          type: string
          enum: [watching, confirming]
        triggerTf:
          type: string
        oiChange:
          type: number
        priceAtEntry:
          type: number
        volumeMultiplier:
          type: number
        sentimentKey:
          type: string
          nullable: true
        addedAt:
          type: string
        expiresAt:
          type: string
        oi30m:
          type: number
          nullable: true
          description: CoinGlass 30m OI change % at detection
        oi1h:
          type: number
          nullable: true
          description: CoinGlass 1h OI change % at detection
        oi24h:
